name: Dependency audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/dependency-audit.yml
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/dependency-audit.yml

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --with pip-audit pip-audit
