name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy aiosellers
      - run: uv run pytest -q --cov=aiosellers --cov-report=term-missing --cov-fail-under=65
      - if: matrix.python-version == '3.12'
        run: uv build
      - if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/aiosellers-wheel
          /tmp/aiosellers-wheel/bin/pip install dist/*.whl
          /tmp/aiosellers-wheel/bin/python -c "from aiosellers import FunPay, Playerok, GGsel, SellerHub"
