name: Feature request
description: Suggest an improvement
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the proposed change. Keep in mind that
        the library stays a thin async client: no scheduler, no proxy service,
        no third-party backend.

  - type: dropdown
    id: platform
    attributes:
      label: Area
      options:
        - FunPay
        - PlayerOK
        - GGsel
        - Core / SellerHub
        - StateStore
        - Documentation / examples
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API shape, configuration, or behavior you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked the README and existing issues.
          required: true
