[project]
name = "aiosellers"
version = "0.2.0"
description = "All In One Sellers API - Universal async API for digital trading platforms (FunPay, PlayerOK, GGsel). Fork of Zewsic/aiosellers with a shared hub and a GGsel adapter."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Daniil Nikishin", email = "danilanicishin@gmail.com" },
]
maintainers = [
    { name = "nechel12", url = "https://github.com/nechel12" },
]
keywords = ["funpay", "playerok", "ggsel", "marketplace", "asyncio", "api-wrapper", "bots"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "idna>=3.11",
    "lxml>=5",
    "pydantic>=2.12.5",
    "websockets>=14",
    "wrapper-tls-requests>=1.1.9",
]

[project.urls]
Homepage = "https://github.com/nechel12/aiosellers"
Repository = "https://github.com/nechel12/aiosellers"
Issues = "https://github.com/nechel12/aiosellers/issues"
Changelog = "https://github.com/nechel12/aiosellers/blob/main/CHANGELOG.md"
Upstream = "https://github.com/Zewsic/aiosellers"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiosellers"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "__pycache__",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Keep linting minimal + style-oriented; formatting is handled by `ruff format`.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
